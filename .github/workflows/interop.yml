name: Interop (Swift ChatManager vs Rust)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  interop:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kiritoX0914/SecureChat-macOS
          path: mac
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit + vector tests
        run: cargo test --no-default-features
      - name: Build Rust peer
        run: cargo build --release --no-default-features --bin sc-peer
      - name: Rust-only 3 peer scenario
        run: bash interop/run-rust-only.sh
      - name: Swift S vs Rust R1/R2
        run: bash interop/run-swift-interop.sh "$GITHUB_WORKSPACE/mac"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: interop-logs/
